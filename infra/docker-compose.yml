name: layover

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: layover-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr=PLAINTEXT://redpanda:8082
    ports:
      - "19092:19092"
      - "8082:8082"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: layover-timescaledb
    environment:
      POSTGRES_USER: layover
      # Overridable (Milestone 10): local dev keeps the same password it
      # always has; a real deploy sets DB_PASSWORD from the Secrets
      # Manager value infra/terraform's user_data script fetches, so the
      # same compose file works in both places without a prod-only fork
      # of this service definition.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-layover}
      POSTGRES_DB: layover
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U layover -d layover"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: layover-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: layover-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health_check extension
      - "8889:8889"   # Prometheus exporter scrape endpoint
    # No container healthcheck: otel/opentelemetry-collector-contrib is a
    # distroless image (no shell, no wget/curl) so an exec-based healthcheck
    # can never run — see DECISIONS.md. Health is verified from the host by
    # scripts/verify_stack.py hitting the health_check extension over HTTP.

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: layover-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      - otel-collector

  # Temporal server (self-hosted, same binary as production -- not the
  # single-process `temporal server start-dev` CLI dev-server, which is
  # SQLite/in-memory-shaped and not what a real kill-test should exercise).
  # Shares this project's existing Postgres instance rather than running a
  # second Postgres container: auto-setup creates its own `temporal` and
  # `temporal_visibility` databases inside it on first boot. See DECISIONS.md.
  temporal:
    image: temporalio/auto-setup:1.29.1
    container_name: layover-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: layover
      POSTGRES_PWD: layover
      POSTGRES_SEEDS: timescaledb
    ports:
      - "7233:7233" # gRPC frontend -- what the Python SDK/worker connects to
    depends_on:
      timescaledb:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: layover-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - temporal

  # Real local SMTP catcher (not a mock): the email alert channel sends
  # genuine SMTP, verifiable via Mailpit's own API/UI, with zero external
  # account or credentials needed. Amazon SES (the spec's deployment choice)
  # is a drop-in swap of the SMTP endpoint/credentials at deploy time --
  # see DECISIONS.md for why this, not SES, for local verification.
  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: layover-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI + REST API
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.1.4
    container_name: layover-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      - prometheus

volumes:
  timescale_data:
