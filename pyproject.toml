[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layover"
version = "0.1.0"
description = "Real-time flight disruption predictor"
requires-python = ">=3.9"
dependencies = [
    "confluent-kafka==2.5.3",
    "psycopg2-binary==2.9.9",
    "redis==5.0.8",
    "requests==2.32.3",
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    "duckdb==1.1.1",
    "timezonefinder==6.5.3",
    "tqdm==4.66.5",
    "lightgbm==4.5.0",
    "mlflow==2.17.1",
    "scikit-learn==1.5.2",
    "aiohttp==3.10.10",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "pytest==8.3.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
